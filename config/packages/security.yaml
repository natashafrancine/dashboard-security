security:
    providers:
        in_memory:
            memory:
                users:
                    guest:
                        password: guest123
                        roles: ["ROLE_GUEST"]
                    demo:
                        password: demo123
                        roles: ["ROLE_USER"]
    password_hashers:
        Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface: "plaintext"

    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false

        main:
            lazy: true
            provider: in_memory
            http_basic: ~

    access_control:
        - { path: ^/dashboard, roles: ROLE_USER }
