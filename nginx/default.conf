server {
    listen 80;
    server_name localhost;

    root /var/www/html/public;  # ✅ Symfony apps always serve from /public
    index index.php;

    location / {
        # ✅ If file doesn't exist, route to index.php (Symfony handles it)
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass PROTECTED-ROUTE:9000;  # container name from docker-compose
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }

    # Optional: better error logging
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
